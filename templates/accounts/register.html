{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7 col-lg-6">

        <div class="card shadow">

            <div class="card-header bg-success text-white text-center">
                <h3 class="mb-0">Create Account</h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    {% for field in form %}

                        <div class="mb-3">

                            <label class="form-label"> 
                                {{ field.label }} 
                                {% if field.name == "first_name" or field.name == "username" or field.name == "role" or field.name == "email" or field.name == "password1" or field.name == "password2" %}
                                    <span class="text-danger">*</span>
                                {% endif %}
                            </label>

                            {{ field }}

                            {% if field.errors %}
                                <div class="text-danger small">
                                    {{ field.errors }}
                                </div>
                            {% endif %}

                        </div>

                    {% endfor %}

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">
                            Register
                        </button>
                    </div>

                </form>

                <hr>

                <p class="text-center mb-0">
                    Already have an account?
                    <a href="{% url 'login' %}">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
