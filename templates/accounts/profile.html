<!DOCTYPE html>
<html>
    <head>
        <title>Profile</title>
    </head>
    <body>
        <h1>My Profile</h1>
        <p>Username:{{ user.username }}</p>
        <p>First Name:{{ user.first_name }}</p>
        <p>Last Name:{{ user.last_name }}</p>
        <p>Email:{{ user.email }}</p>
        <p>Phone:{{ user.phone }} </p>
        <p>Role:{{ user.role }}</p>
        <a href="{% url 'logout' %}">Logout</a>
    </body>
</html>
