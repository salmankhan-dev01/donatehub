<!DOCTYPE html>

<html>
    <head>
        <title>My Donations</title>
    </head>

    <body>
        <h1>My Donations</h1>
        <table border="1">
            <tr>
                <th>Campaign</th>
                <th>Amount</th>
                <th>Date</th>
            </tr>
            {% for donation in donations%}
            <tr>
                <td>{{donation.campaign.title}}</td>
                <td>{{donation.amount}}</td>
                <td>{{donation.donated_at}}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3">No Donation Found</td>
            </tr>
            {% endfor %}
        </table>

    </body>
</html>
